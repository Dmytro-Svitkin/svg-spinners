<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Spinners Demo</title>
    <link rel="icon"href="./assets/peppermint-spinner.svg">
    <style>
        @keyframes colorCycle{
            0%{background-color:crimson}
            14%{background-color:coral}
            29%{background-color:khaki}
            43%{background-color:mediumseagreen}
            57%{background-color:deepskyblue}
            71%{background-color:royalblue}
            86%{background-color:indigo}
            93%{background-color:darkmagenta}
            100%{background-color:crimson}
        }

        body{
            margin:0;
            padding:32px;
            min-height:100dvh;
            display:flex;
            justify-content:center;
            align-content:center;
            align-items:center;
            flex-wrap:wrap;
            gap:8px;
            animation:colorCycle 30s infinite ease-in-out
        }

        img{
            width:64px;
            height:64px
        }
    </style>
</head>
<body style="background-color:powderblue">
    <a href="./assets/aero-spinner.svg"download><img src="./assets/aero-spinner.svg"></a>
    <a href="./assets/peppermint-spinner.svg"download><img src="./assets/peppermint-spinner.svg"></a>

    <a href="./assets/simple-spinner-1.svg"download><img src="./assets/simple-spinner-1.svg"></a>
    <a href="./assets/simple-spinner-2.svg"download><img src="./assets/simple-spinner-2.svg"></a>
    <a href="./assets/square-spinner.svg"download><img src="./assets/square-spinner.svg"></a>
    <a href="./assets/square-spinner-2.svg"download><img src="./assets/square-spinner-2.svg"></a>
    <a href="./assets/sand-clock-spinner.svg"download><img src="./assets/sand-clock-spinner.svg"></a>
</body>
</html>
